# Local workstation only. Perangkat lain wajib memakai reverse proxy same-origin; lihat docs/API_URL_STRATEGY.md.
name: absensi-sppg

networks:
  app:
    driver: bridge

volumes:
  db_data:
  private_selfies:

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - app
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in infra/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-absensi_sppg}
      MYSQL_USER: ${DB_USERNAME:-sppg_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-local}
        VCS_REF: ${VCS_REF:-unknown}
    image: ${BACKEND_IMAGE:-absensi-sppg-backend}:${APP_VERSION:-local}
    restart: unless-stopped
    networks:
      - app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8040}:80"
    environment:
      APP_NAME: "Absensi SPPG Pakiskembar 2"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?Set APP_KEY in infra/.env}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: Asia/Jakarta
      APP_URL: ${APP_URL:-http://localhost:8040}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-absensi_sppg}
      DB_USERNAME: ${DB_USERNAME:-sppg_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      DB_TIMEZONE: "+07:00"
      FILESYSTEM_DISK: private
      LOG_CHANNEL: stderr
    volumes:
      - private_selfies:/var/www/html/storage/app/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        VCS_REF: ${VCS_REF:-unknown}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
    image: ${FRONTEND_IMAGE:-absensi-sppg-frontend}:${APP_VERSION:-local}
    restart: unless-stopped
    networks:
      - app
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3041}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' ':8080 {' '  encode gzip' '  request_body { max_size 6MB }' '  handle /api/* {' '    reverse_proxy backend:80' '  }' '  handle /up {' '    reverse_proxy backend:80' '  }' '  handle {' '    reverse_proxy frontend:3000' '  }' '}' > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    networks:
      - app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3040}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
