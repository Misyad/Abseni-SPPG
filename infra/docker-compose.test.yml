name: ${COMPOSE_PROJECT_NAME:-absensi-sppg-ci}

services:
  test_db:
    image: mysql:8.0
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ci_root_only
      MYSQL_DATABASE: absensi_sppg_test
      MYSQL_USER: ci_test_user
      MYSQL_PASSWORD: ci_test_only
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  test_runner:
    image: ${BACKEND_TEST_IMAGE:-absensi-sppg-backend-testing:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: testing
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mysql
      DB_HOST: test_db
      DB_PORT: 3306
      DB_DATABASE: absensi_sppg_test
      DB_USERNAME: ci_test_user
      DB_PASSWORD: ci_test_only
      DB_TIMEZONE: "+07:00"
      FILESYSTEM_DISK: private
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    depends_on:
      test_db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        php artisan config:clear &&
        php artisan migrate:fresh --force &&
        php artisan test --log-junit storage/test-results/junit.xml
